name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-sh:
    name: install-all.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install-all.sh

  syntax-ps1:
    name: install-all.ps1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse without executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install-all.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'install-all.ps1 parses clean'

  parity:
    name: plugin list parity (roster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the two installers
        run: node scripts/check-parity.mjs

  links:
    name: README links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every http(s) link in README.md
        run: node scripts/check-readme-links.mjs
